name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Version et décision de release
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "Le tag v$VERSION existe : build de vérification."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$GITHUB_EVENT_NAME" = "push" ] && [ -n "$KEYSTORE_BASE64" ]; then
            echo "Nouvelle version v$VERSION : release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/azur.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/azur.jks" >> "$GITHUB_ENV"

      - name: Build, lint et tests
        run: ./gradlew assembleRelease lint testDebugUnitTest -PversionCode=${{ github.run_number }} --stacktrace

      - name: APK
        run: cp app/build/outputs/apk/release/app-release.apk "azur-v${{ steps.version.outputs.version }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: azur-v${{ steps.version.outputs.version }}
          path: azur-v*.apk

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports/

      - name: Changelog
        if: steps.version.outputs.release == 'true'
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          RANGE=${PREV:+$PREV..HEAD}
          {
            echo "## Nouveautés"
            git log --no-merges --pretty='- %s' $RANGE | grep -v -i 'co-authored' | head -50
          } > notes.md
          cat notes.md

      - name: GitHub Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ steps.version.outputs.version }}
          gh release create "v$V" "azur-v$V.apk" --target "$GITHUB_SHA" --title "Azur $V" --notes-file notes.md
